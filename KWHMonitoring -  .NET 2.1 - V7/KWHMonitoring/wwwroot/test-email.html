<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview Email Templates - KWH Monitoring</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a1d23;
        }
        .template-selector {
            text-align: center;
            margin: 20px 0 40px;
        }
        .template-selector button {
            padding: 10px 16px;
            margin: 4px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        .template-selector button:hover {
            background: #0a58ca;
        }
        .preview-frame {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        iframe {
            width: 100%;
            height: 800px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Preview Template Email - KWH Monitoring</h1>
        <div class="template-selector">
            <button data-template="verification">Verifikasi Email</button>
            <button data-template="accessRequest">Permintaan Akses</button>
            <button data-template="approved">Akses Disetujui</button>
            <button data-template="rejected">Akses Ditolak</button>
            <button data-template="resetPassword">Reset Password</button>
            <button data-template="criticalAction">Aksi Kritis</button>
        </div>
        <div class="preview-frame">
            <iframe id="emailPreview" title="Email Preview"></iframe>
        </div>
    </div>

    <script>
        function buildTemplate(type) {
            var sampleBaseUrl = 'https://localhost:7263';
            var sampleToken = 'RyA_swhi6vzYo7HHI4kW4X7LyLEXFi2JPh_WPrTxPdp3pinFTP1yg6tD2jW-vj_ZTJ8RYbMA-Ooeu6-xxJlEg';
            var sampleLink = sampleBaseUrl + '/Account/ResetPassword?email=user@example.com&token=' + sampleToken;
            var approvalLink = sampleBaseUrl + '/AdminApproval/Approve?token=' + sampleToken;
            var now = new Date().toISOString().replace('T', ' ').substring(0, 19);

            var templates = {
                verification: {
                    title: 'Verifikasi Email Anda',
                    accent: '#0d6efd',
                    content: '<p style="margin:0 0 16px 0;">Halo,</p>' +
                        '<p style="margin:0 0 16px 0;">Terima kasih telah mendaftar di <strong>KWH Monitoring</strong>. Untuk melanjutkan, silakan verifikasi email Anda dengan menekan tombol di bawah ini.</p>' +
                        '<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0;"><tr><td>' + ctaButton(approvalLink, 'Verifikasi Email') + '</td></tr></table>' +
                        '<p style="margin:0 0 8px 0;">Atau salin link berikut ke browser Anda:</p>' +
                        '<p style="margin:0 0 16px 0;word-break:break-all;"><a href="' + approvalLink + '" style="color:#0d6efd;text-decoration:none;">' + approvalLink + '</a></p>' +
                        '<p style="margin:0 0 8px 0;"><i>&#9201;</i> Link ini berlaku selama <strong>24 jam</strong>.</p>' +
                        '<p style="margin:0;"><i>&#128231;</i> Jika email tidak muncul di inbox, periksa juga folder Spam.</p>'
                },
                accessRequest: {
                    title: 'Permintaan Akses Pengguna Baru',
                    accent: '#198754',
                    content: '<p style="margin:0 0 16px 0;">Halo Admin,</p>' +
                        '<p style="margin:0 0 16px 0;">Pengguna berikut telah memverifikasi email dan meminta akses ke sistem <strong>KWH Monitoring</strong>:</p>' +
                        '<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f8f9fa;border-radius:10px;margin:16px 0;">' +
                        '<tr><td style="padding:16px 20px;">' +
                        '<p style="margin:0 0 8px 0;"><strong>Email:</strong> user@example.com</p>' +
                        '<p style="margin:0;"><strong>Nama:</strong> Budi Santoso</p>' +
                        '</td></tr></table>' +
                        '<p style="margin:0 0 16px 0;">Klik tombol di bawah untuk menyetujui atau menolak akses pengguna:</p>' +
                        '<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0;"><tr><td>' + ctaButton(approvalLink, 'Proses Persetujuan', '#198754') + '</td></tr></table>' +
                        '<p style="margin:0 0 8px 0;">Atau salin link ini ke browser:</p>' +
                        '<p style="margin:0 0 16px 0;word-break:break-all;"><a href="' + approvalLink + '" style="color:#0d6efd;text-decoration:none;">' + approvalLink + '</a></p>' +
                        '<p style="margin:0;"><i>&#9201;</i> Link ini berlaku selama <strong>24 jam</strong>.</p>'
                },
                approved: {
                    title: 'Akses Disetujui',
                    accent: '#198754',
                    content: '<p style="margin:0 0 16px 0;">Halo,</p>' +
                        '<p style="margin:0 0 16px 0;">Selamat! Permintaan akses Anda ke <strong>KWH Monitoring</strong> telah disetujui oleh administrator.</p>' +
                        '<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;margin:16px 0;">' +
                        '<tr><td style="padding:16px 20px;"><p style="margin:0;"><strong>Role:</strong> Operator</p></td></tr></table>' +
                        '<p style="margin:0 0 16px 0;">Anda sekarang dapat login ke sistem dan mulai menggunakan fitur KWH Monitoring.</p>' +
                        '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px 20px;margin:16px 0;">' +
                        '<p style="margin:0;color:#0f5132;">Silakan kunjungi halaman login KWH Monitoring untuk masuk ke akun Anda.</p></div>'
                },
                rejected: {
                    title: 'Akses Ditolak',
                    accent: '#dc3545',
                    content: '<p style="margin:0 0 16px 0;">Halo,</p>' +
                        '<p style="margin:0 0 16px 0;">Kami informasikan bahwa permintaan akses Anda ke <strong>KWH Monitoring</strong> telah ditolak oleh administrator.</p>' +
                        '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:16px 20px;margin:16px 0;">' +
                        '<p style="margin:0;color:#842029;">Jika Anda merasa ini adalah kesalahan, silakan hubungi administrator sistem untuk informasi lebih lanjut.</p></div>'
                },
                resetPassword: {
                    title: 'Reset Password',
                    accent: '#0d6efd',
                    content: '<p style="margin:0 0 16px 0;">Halo,</p>' +
                        '<p style="margin:0 0 16px 0;">Kami menerima permintaan reset password untuk akun Anda di <strong>KWH Monitoring</strong>. Klik tombol di bawah untuk membuat password baru.</p>' +
                        '<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0;"><tr><td>' + ctaButton(sampleLink, 'Reset Password') + '</td></tr></table>' +
                        '<p style="margin:0 0 8px 0;">Atau salin link berikut ke browser Anda:</p>' +
                        '<p style="margin:0 0 16px 0;word-break:break-all;"><a href="' + sampleLink + '" style="color:#0d6efd;text-decoration:none;">' + sampleLink + '</a></p>' +
                        '<p style="margin:0 0 8px 0;"><i>&#9201;</i> Link ini berlaku selama <strong>1 jam</strong>.</p>' +
                        '<p style="margin:0;"><i>&#128683;</i> Jika Anda tidak meminta reset password, abaikan email ini.</p>'
                },
                criticalAction: {
                    title: 'Aksi Kritis pada KWH Monitoring',
                    accent: '#dc3545',
                    content: '<p style="margin:0 0 16px 0;">Halo Admin,</p>' +
                        '<p style="margin:0 0 16px 0;">Aksi berikut dilakukan oleh pengguna dan memerlukan perhatian Anda:</p>' +
                        '<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;background:#ffffff;border:1px solid #e9ecef;border-radius:10px;overflow:hidden;">' +
                        '<tr style="border-bottom:1px solid #e9ecef;"><td style="padding:12px 16px;width:120px;font-weight:bold;color:#1a1d23;background:#f8f9fa;">Waktu</td><td style="padding:12px 16px;color:#495057;">' + now + ' UTC</td></tr>' +
                        '<tr style="border-bottom:1px solid #e9ecef;"><td style="padding:12px 16px;font-weight:bold;color:#1a1d23;background:#f8f9fa;">Actor</td><td style="padding:12px 16px;color:#495057;">admin@example.com</td></tr>' +
                        '<tr style="border-bottom:1px solid #e9ecef;"><td style="padding:12px 16px;font-weight:bold;color:#1a1d23;background:#f8f9fa;">Aksi</td><td style="padding:12px 16px;color:#495057;">Delete User</td></tr>' +
                        '<tr><td style="padding:12px 16px;font-weight:bold;color:#1a1d23;background:#f8f9fa;">Detail</td><td style="padding:12px 16px;color:#495057;">Pengguna budi@example.com dihapus dari sistem.</td></tr>' +
                        '</table>' +
                        '<p style="margin:16px 0 0 0;font-size:13px;color:#6c757d;">Email ini dikirim secara otomatis oleh sistem KWH Monitoring.</p>'
                }
            };

            var t = templates[type] || templates.verification;
            return buildEmailTemplate(t.title, t.content, t.accent);
        }

        function ctaButton(url, label, color) {
            color = color || '#0d6efd';
            return '<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-radius:10px;">' +
                '<tr><td align="center" bgcolor="' + color + '" style="background-color:' + color + ';border-radius:10px;">' +
                '<a href="' + url + '" style="display:inline-block;padding:14px 28px;background-color:' + color + ';color:#ffffff;text-decoration:none;border-radius:10px;font-weight:600;font-size:15px;font-family:Arial,Helvetica,sans-serif;">' + label + '</a>' +
                '</td></tr></table>';
        }

        function buildEmailTemplate(title, contentHtml, accentColor) {
            accentColor = accentColor || '#0d6efd';
            return '<!DOCTYPE html>' +
                '<html lang="id">' +
                '<head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>' + title + '</title></head>' +
                '<body style="margin:0;padding:0;background-color:#f4f6fb;">' +
                '<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f4f6fb" style="background-color:#f4f6fb;">' +
                '<tr><td align="center" style="padding:40px 20px;">' +
                '<table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">' +
                '<tr><td style="padding:40px 40px 0 40px;text-align:center;">' +
                '<table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin:0 auto;background-color:' + accentColor + ';border-radius:16px;">' +
                '<tr><td style="width:64px;height:64px;text-align:center;vertical-align:middle;"><span style="font-size:30px;color:#ffffff;line-height:64px;">&#9889;</span></td></tr>' +
                '</table></td></tr>' +
                '<tr><td style="padding:24px 40px 0 40px;text-align:center;"><h1 style="margin:0;font-size:24px;font-weight:700;color:#1a1d23;font-family:Arial,Helvetica,sans-serif;">' + title + '</h1></td></tr>' +
                '<tr><td style="padding:24px 40px 32px 40px;font-size:16px;line-height:1.7;color:#495057;">' + contentHtml + '</td></tr>' +
                '<tr><td style="padding:0 40px 40px 40px;border-top:1px solid #e9ecef;">' +
                '<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="padding-top:24px;">' +
                '<tr><td style="font-size:12px;color:#6c757d;text-align:center;line-height:1.6;font-family:Arial,Helvetica,sans-serif;">' +
                '<p style="margin:0 0 8px 0;">Email ini dikirim secara otomatis oleh sistem <strong>KWH Monitoring</strong>.</p>' +
                '<p style="margin:0;">Jika Anda tidak merasa melakukan permintaan ini, abaikan email ini atau hubungi administrator.</p>' +
                '</td></tr></table></td></tr>' +
                '</table></td></tr></table></body></html>';
        }

        function showTemplate(type) {
            var html = buildTemplate(type);
            var blob = new Blob([html], { type: 'text/html' });
            var url = URL.createObjectURL(blob);
            document.getElementById('emailPreview').src = url;
        }

        document.addEventListener('DOMContentLoaded', function () {
            var buttons = document.querySelectorAll('.template-selector button');
            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    showTemplate(this.dataset.template);
                });
            });
            showTemplate('verification');
        });
    </script>
</body>
</html>
